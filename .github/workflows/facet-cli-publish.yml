# Facet CLI publish — npm OIDC trusted publishing (add-facet-platform 4.5).
#
# Publishing happens from GitHub Actions with --provenance; no long-lived npm
# token lives anywhere. The package currently lives under the personal scope of
# the maintainer account (`@finddatatechonology`), which inherits the account
# username — a name that is misspelled and cannot be renamed on npm.
# NOTE (2026-10-06): the intended fix is an org-scoped republish to
# `@finddatatechnology/facet`; runbook in facet/cli/NPM-SCOPE-FIX.md.
# Until that lands this workflow keeps publishing under the current scope.
# One-time bootstrap (package does
# not exist on npm yet, and trusted-publisher settings live on the package's
# npmjs.com page):
#   1. bootstrap first publish from a logged-in maintainer machine:
#        cd facet/cli && npm publish --access public
#   2. on the package's npmjs.com settings → Trusted Publisher, register:
#        GitHub org FindDataTechnology, repo platform, workflow
#        facet-cli-publish.yml;
#   3. from then on, tag `facet-cli-v<version>` publishes via this workflow.
name: facet-cli-publish

on:
  push:
    tags: ["facet-cli-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: Publish @finddatatechonology/facet
        working-directory: facet/cli
        run: npm publish --provenance --access public