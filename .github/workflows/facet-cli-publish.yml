# Facet CLI publish — npm OIDC trusted publishing (add-facet-platform 4.5).
#
# Publishing happens from GitHub Actions with --provenance; no long-lived npm
# token lives anywhere. One-time bootstrap (package does not exist on npm yet,
# and trusted-publisher settings live on the package's npmjs.com page):
#   1. (once, by the org owner) ensure the `@finddata` org exists on npmjs.com;
#   2. bootstrap first publish from a logged-in maintainer machine:
#        cd facet/cli && npm publish --access public
#   3. on the package's npmjs.com settings → Trusted Publisher, register:
#        GitHub org FindDataTechnology, repo platform, workflow
#        facet-cli-publish.yml;
#   4. from then on, tag `facet-cli-v<version>` publishes via this workflow.
name: facet-cli-publish

on:
  push:
    tags: ["facet-cli-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: Publish @finddata/facet
        working-directory: facet/cli
        run: npm publish --provenance --access public