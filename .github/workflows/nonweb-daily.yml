name: nonweb-daily

# 非 web 端每日验收（automate-nonweb-acceptance）：把私仓 HEAD 打成干净快照，
# 推池固定分支 nonweb-daily，再在池侧 dispatch app-e2e（配对/页签/语言/聊天
# 错误面/图表四系列全跑）。私仓只花 ubuntu 1-2 分钟，重腿全在池。
#
# arm-ready：需要 secret BUILD_POOL_TOKEN（对 testaction003/build-pool 有
# contents:write + workflow 的令牌）。缺失时本 job 显式输出 SKIPPED 并以 0
# 退出——绝不产生"验收通过"的信号；配好后无需改代码即自动生效。
#
# 诊断：本私仓 job 日志常取不到（BlobNotFound）——脚本输出 tee 到工件上传。

on:
  schedule:
    - cron: "30 19 * * *" # UTC 19:30 = 北京 03:30，低峰
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: snapshot → pool dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POOL_TOKEN: ${{ secrets.BUILD_POOL_TOKEN }}
      POOL_REPO: testaction003/build-pool
      SNAP_BRANCH: nonweb-daily
    steps:
      - name: Skip when the pool token is not configured
        if: env.POOL_TOKEN == ''
        run: |
          echo "SKIPPED: BUILD_POOL_TOKEN missing — nonweb acceptance is armed but not enabled" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: env.POOL_TOKEN != ''

      - name: Install gitleaks (zero-leak hard gate before any push)
        if: env.POOL_TOKEN != ''
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Export clean snapshot (tracked files only) + trim workflows
        if: env.POOL_TOKEN != ''
        run: |
          {
            set -euo pipefail
            mkdir -p "$RUNNER_TEMP/snap"
            git archive HEAD | tar -x -C "$RUNNER_TEMP/snap"
            cd "$RUNNER_TEMP/snap"
            find .github/workflows -type f ! -name app-e2e.yml -delete
            gitleaks dir . --redact --no-banner
            echo "gitleaks: zero findings"
          } 2>&1 | tee -a /tmp/daily.log

      - name: Push snapshot and dispatch the pool run
        if: env.POOL_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.BUILD_POOL_TOKEN }}
        run: |
          {
            set -euo pipefail
            # OAuth tokens (gho_) reject the x-access-token: URL form (locally
            # reproduced "Authentication failed") — go through gh's own
            # credential helper (Basic auth) instead.
            gh auth setup-git
            cd "$RUNNER_TEMP/snap"
            git init -q -b "$SNAP_BRANCH"
            git add -A
            git -c user.name='nonweb-daily' -c user.email='ci@finddata.local' \
              commit -qm "paas @ ${GITHUB_SHA} — daily acceptance snapshot"
            git push -q -f "https://github.com/${POOL_REPO}.git" "HEAD:${SNAP_BRANCH}"
            gh workflow run app-e2e.yml -R "$POOL_REPO" --ref "$SNAP_BRANCH"
            sleep 10
            gh run list -R "$POOL_REPO" --workflow app-e2e.yml --limit 1 \
              --json databaseId,status,headBranch,url \
              --jq '.[] | "\(.url) [\(.headBranch)] \(.status)"' | tee -a "$GITHUB_STEP_SUMMARY"
          } 2>&1 | tee -a /tmp/daily.log

      - name: Upload diagnostics (this repo's job logs are often unreadable)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nonweb-daily-diagnostics
          path: /tmp/daily.log
          retention-days: 7
          if-no-files-found: ignore
