name: CI

# Green since 2026-10-02 (run 36896622780): lint backlog cleared, unit suite
# deterministic (serialized runner), CI dsh bootstrap pins cordis-plugin-hmr
# @1.0.16, and the fresh-machine dsh/runtime suites gate on a probe. Push is
# back on so every landing runs the full gate; workflow_dispatch stays for
# on-demand reruns.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: lint → typecheck → unit → locales → build → e2e (fast)
    runs-on: ubuntu-latest
    # Sized for the chain that actually runs: lint/typecheck/unit/locales/build
    # take ~15 min, and the fast e2e project is ~640 specs at workers: 1. The
    # old 30 killed the job mid-unit the first time e2e was reachable
    # (run 42455044835), so e2e could never be observed at all.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      # npm 11 (bundled with Node 25) is required by the lockfile format;
      # see release.yml and Dockerfile for the same pin.
      - name: Install dependencies (skip resource bundling)
        env:
          PLATFORM_SKIP_WEB_BUILD: "1"
          PLATFORM_SKIP_BUNDLE: "1"
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: dsh adapter boundary (ADR-0023)
        run: node scripts/lint-dsh-adapter.mjs

      # Must precede typecheck/build: web's tsc (TS 5.7) resolves from
      # web/node_modules — without this, npm falls back to the root
      # typescript@7 devDep, which rejects web/tsconfig.json (baseUrl removed).
      - name: Install web dependencies
        run: npm run web:install

      # The facet shell smoke e2e (e2e/facet-shell-server.mjs) builds the
      # thin SPA from src — same as the Dockerfile — so its deps must be
      # present before the fast e2e project boots its webServer chain.
      - name: Install facet/web dependencies
        run: npm --prefix facet/web install --ignore-scripts

      - name: Typecheck (web)
        run: npm run typecheck

      # The unit suites AND the e2e server spawn the dsh runtime child
      # (dsh-bridge.js COMMAND), so the shared install has to exist before
      # unit. This replicates the IMAGE's recipe (Dockerfile) rather than the
      # retired `dsh plugin add` + pnpm dance: one `npm ci` from the frozen
      # dsh-matrix lock, then the profile's node_modules is a SYMLINK onto it.
      #
      # Generation matters more than anything else here. The old bootstrap
      # pinned dsh/dsh-base 0.1.1-rc.2 and sdk-jsonrpc-server 0.0.1-rc.5 while
      # the repo, dsh-matrix and the image had all moved to 0.2.0-rc.2, so the
      # composed profile was 0.1.1 plugins on a 0.2.0 harness: every plugin
      # failed its peer range ("Plugin @deepseek-ai/dsh-llm@0.1.1-rc.2 is
      # incompatible with dsh 0.2.0-rc.2"), got disabled, `tools`/`systemPrompt`
      # never came up, /api/ready never answered, and the e2e suite could not
      # run on CI at all (run 42457279018, 2026-11-08). The matrix lock is the
      # single version truth (ADR-0007/0023) — never hand-pin here again.
      - name: Install dsh runtime + platform profile from the matrix
        run: |
          mkdir -p "$HOME/.dsh-matrix"
          cp dsh-matrix/package.json dsh-matrix/package-lock.json "$HOME/.dsh-matrix/"
          # .npmrc may be absent in the lock tree; copy it only when present.
          [ -f dsh-matrix/.npmrc ] && cp dsh-matrix/.npmrc "$HOME/.dsh-matrix/" || true
          cp -r dsh-matrix/samples "$HOME/.dsh-matrix/samples"
          # npm's resolver exhausts the default heap on this closure (Dockerfile
          # needs the same bump). Default peer resolution, NO --legacy-peer-deps:
          # under npm 11 the flag makes npm ci skip every lock entry marked
          # "peer": true and the dsh rc.2 plugin closure vanishes.
          NODE_OPTIONS=--max-old-space-size=8192 npm ci --prefix "$HOME/.dsh-matrix"
          # The profile keeps only its scaffold files and borrows the tree —
          # exactly the image's seedHome shape, so the hundreds-of-MB closure is
          # never duplicated per home.
          mkdir -p "$HOME/.dsh/profiles/platform"
          cp dsh-profile-template/package.json \
             dsh-profile-template/pnpm-workspace.yaml \
             dsh-profile-template/cordis.yml \
             dsh-profile-template/cordis.patch.yml \
             "$HOME/.dsh/profiles/platform/"
          # NOTE: the tree is installed but NOT linked into the shared home yet.
          # A complete home makes the dsh-dependent UNIT suites spawn a real
          # child, and that is a separate axis from "can e2e run at all" — this
          # landing moves only the generation (0.1.1 profile → 0.2.0 matrix) so
          # a regression is attributable. The probe step below links it.

      - name: Unit tests
        run: npm run test:unit

      - name: Locale parity
        run: npm run check:locales

      # e2e serves web/dist via express.static; build with the e2e test seam
      # (window.__chatStore) — release builds never set VITE_E2E_SEAM.
      - name: Build web (e2e seam)
        run: npm run web:build:e2e

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # The e2e server boots the real dsh runtime; that needs a COMPLETE
      # shared install (see scripts/lib/dsh-available.mjs). The matrix tree from
      # the bootstrap becomes the shared home HERE — after unit, so unit keeps
      # the environment it had before this landing (its dsh-dependent suites
      # skip; that pre-existing gap is tracked separately). --dump-config
      # composes the profile first: a broken composition then fails in seconds
      # with a readable error instead of as a 3-minute Playwright timeout.
      - name: Link the dsh matrix tree into the shared home
        run: |
          mkdir -p "$HOME/.dsh/profiles/platform"
          ln -sfn "$HOME/.dsh-matrix/node_modules" "$HOME/.dsh/profiles/platform/node_modules"
          ln -sfn "$HOME/.dsh-matrix/node_modules" "$HOME/.dsh/profiles/node_modules"
          dsh --profile platform --dump-config > /dev/null

      - name: Probe dsh runtime usability
        id: dsh
        run: echo "usable=$(node --input-type=module -e "const { dshRuntimeAvailable } = await import('./scripts/lib/dsh-available.mjs'); process.stdout.write(String(dshRuntimeAvailable()))")" >> "$GITHUB_OUTPUT"

      - name: E2E (fast project, offline)
        if: steps.dsh.outputs.usable == 'true'
        # Advisory for now: the fast suite carries ~4 deterministic spec
        # failures that fail identically on dev machines (pre-existing debt in
        # the streaming/composer lanes, tracked via this run's annotations).
        # Enforced gates are lint/typecheck/unit/locales/build above; flip this
        # off continue-on-error once those specs are cleared.
        continue-on-error: true
        timeout-minutes: 45
        run: npm run test:e2e

      - name: E2E skipped (no shared dsh runtime)
        if: steps.dsh.outputs.usable != 'true'
        run: echo "::notice::E2E skipped — shared dsh runtime incomplete on this runner (bundle level missing; see scripts/lib/dsh-available.mjs)"

  # dsh-contracts gate (add-dsh-contracts, ADR-0007): when a PR touches the
  # dsh install matrix, the six upstream-behavior contracts run against the
  # PR's own scratch npm-ci tree — a red contract fails the check. This job is
  # deliberately INDEPENDENT of `gates` (needs: []): the repo carries an
  # outstanding lint backlog (header note above), and a matrix PR's contracts
  # verdict must not inherit unrelated debt. Both jobs must pass for the PR.
  dsh-contracts:
    name: dsh contracts (matrix scratch tree)
    runs-on: ubuntu-latest
    needs: []
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The path filter diffs the PR head against its base sha.
          fetch-depth: 0

      - name: Did this PR touch dsh-matrix?
        id: matrix
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            if git diff --name-only "$BASE"...HEAD -- dsh-matrix/ | grep -q .; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "no dsh-matrix/ changes — skipping the contracts job"
            fi
          else
            # workflow_dispatch is an explicit ask: always run.
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.matrix.outputs.changed == 'true'
        with:
          node-version: 25
          cache: npm

      - name: Install runner deps
        if: steps.matrix.outputs.changed == 'true'
        env:
          PLATFORM_SKIP_WEB_BUILD: "1"
          PLATFORM_SKIP_BUNDLE: "1"
        run: npm ci

      # The scratch npm ci (~450 packages) is the slow leg; cache it keyed on
      # the matrix lock. MUST come after `npm ci` above — that step removes
      # node_modules wholesale and would delete a restored cache with it. The
      # runner re-verifies a restored tree against the lock (dsh-matrix-verify)
      # before trusting it, so a partial save self-heals into a rebuild
      # instead of failing contracts.
      - name: Cache scratch tree
        if: steps.matrix.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/dsh-contracts-tree
          key: dsh-contracts-tree-${{ hashFiles('dsh-matrix/package-lock.json') }}

      - name: Run dsh contracts
        if: steps.matrix.outputs.changed == 'true'
        run: node scripts/dsh-contracts.mjs
