# ── 通道注记（revive-nonweb-ci，2026-10-27）──────────────────────────────
# 本 workflow 的 macOS/Windows 矩阵**只走公开池侧分支通道**运行：
# `testaction003/build-pool` 侧分支 `desktop-release/<ver>`（gitleaks 零泄漏
# 快照 + workflow 修剪至本文件 + win-install-smoke），tag 触发。本私有仓的
# 私有 minute 不为它付费 —— 见 docs/registry-maintenance.md「非 web 端通道」。
#
# ── Release: build .dmg (mac arm64 + x64) + .exe (win x64) on tag / dispatch ───
#
# Triggers:
#   - push tag v*        -> build both, attach installers to a GitHub Release
#   - workflow_dispatch  -> build both, upload as workflow artifacts (no release)
#
# `build-node.js` auto-matches the bundled standalone Node to the Node running
# the build (process.version), so the native-addon ABI parity holds on whichever
# Node `setup-node` provides. The bundled Node is the only build artifact and is
# cross-platform.
#
# Signing is gated on secrets: when CSC_LINK / WIN_CSC_LINK (+ notarization
# secrets) are present the installers are signed/notarized; when absent the
# build still succeeds unsigned (CI smoke). See openspec change
# `ci-build-installers`.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "复用既有 build 产物（run id；填了则跳过 build 只跑 installer-e2e）"
        required: false
        default: ""
      installer_e2e_mac:
        description: "同时跑 macOS 装机 e2e 腿（默认关：mac ×10 计费，月频显式开）"
        required: false
        default: "false"

permissions:
  contents: write # softprops/action-gh-release creates/edits the Release
  actions: read # installer-e2e reuse mode: gh run download of a prior run's artifact

jobs:
  build:
    name: build (${{ matrix.artifact }})
    if: ${{ github.event.inputs.artifact_run_id == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon (arm64)
            arch: arm64
            artifact: dmg-arm64
          - os: macos-latest # arm64 host, x64 target via Rosetta
            arch: x64
            artifact: dmg-x64
          - os: windows-latest # x64
            arch: x64
            artifact: exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # x64 mac build runs on the arm64 runner via Rosetta: install it so the
      # x64 Node + x64 python-build-standalone binaries can execute.
      - name: Install Rosetta
        if: runner.os == 'macOS' && matrix.arch == 'x64'
        run: softwareupdate --install-rosetta --agree-to-license || true

      # Node 25 (not an LTS) MUST match the version package-lock.json was
      # generated under (npm 11). Node 22's npm 10 misreads the npm-11 lock
      # ("Missing: zod@... from lock file"). architecture: x64 on the x64 mac
      # job installs x64 Node (runs via Rosetta) so npm ci compiles
      # better-sqlite3 for the x64 ABI; build-node.js then bundles the matching
      # x64 Node (process.arch == x64). Bump with the dev Node if you regen lock.
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
          architecture: ${{ matrix.arch }}
          cache: 'npm'

      # Cache the bundled Node. predist is idempotent and skips when present,
      # so a cache hit turns the download into a no-op. Keyed by OS + arch +
      # package.json + the build scripts.
      - name: Cache resources/
        uses: actions/cache@v4
        with:
          path: resources
          key: resources-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('package.json', 'scripts/build-*.js', 'scripts/verify-bundle.js') }}
          # Same-arch only: do NOT fall back across arches (an arm64 cache
          # restored into the x64 job would skip the rebuild and ship arm64
          # binaries in an x64 dmg).
          restore-keys: |
            resources-${{ matrix.os }}-${{ matrix.arch }}-

      # postinstall installs web/ deps + builds web/dist AND builds the bundled
      # resources (when not cached). predist then ensures the bundled Node is
      # built and verifies all resources. No skip flags - idempotency handles it.
      #
      # --legacy-peer-deps RETIRED (ADR-0023): the 0.2.0 unified dsh
      # generation has one lockstep version and no conflicting peers; the
      # historical flag existed for the rc.2/rc.5 mix (v1.3.5 release run:
      # three matrices ERESOLVE at this step).
      - name: Install dependencies
        run: npm ci

      - name: Build bundled resources + verify
        run: npm run predist

      - name: Build web + package installers
        shell: bash
        env:
          # Build branding (deployment-branding): fork-settable repo variables
          # (Settings → Secrets and variables → Actions → Variables) so a fork
          # brands its installers without editing the workflow. Unset = the
          # defaults (name "Platform", vendored build/icon.png).
          PRODUCT_NAME: ${{ vars.PRODUCT_NAME }}
          ICON_URL: ${{ vars.ICON_URL }}
          COMPANY_NAME: ${{ vars.COMPANY_NAME }}
          # macOS signing + notarization (gated - empty/absent = unsigned;
          # electron-builder's built-in `mac.notarize` skips when APPLE_* env
          # is absent, so unsigned CI smoke builds still succeed)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows signing (gated - empty/absent = unsigned)
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          # A missing GitHub secret becomes an empty-string env var, which
          # electron-builder treats as "set" and tries to sign with an empty
          # cert path (fails: "<project> not a file"). Unset empties so it
          # skips signing -> unsigned build when no cert is configured.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            [ -z "${!v}" ] && unset "$v"
          done
          # `npm run dist` runs electron-builder via `node .../cli.js` directly
          # (not the bare bin command): the npm bin shim in a `&&` chain
          # silently no-ops on the Windows runner (see package.json `dist`).
          # Echo the resolved branding so a dispatch dry run logs what it used.
          echo "PRODUCT_NAME='${PRODUCT_NAME:-Platform}' COMPANY_NAME='${COMPANY_NAME:-<unset>}'"
          [ -n "$ICON_URL" ] && echo "ICON_URL=$ICON_URL" || echo "ICON_URL=<unset> (vendored icon)"
          npm run dist -- --${{ matrix.arch }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/latest*.yml
          if-no-files-found: error

  release:
    name: publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download mac arm64 installer
        uses: actions/download-artifact@v4
        with:
          name: platform-dmg-arm64
          path: dist
      - name: Download mac x64 installer
        uses: actions/download-artifact@v4
        with:
          name: platform-dmg-x64
          path: dist
      - name: Download windows installer
        uses: actions/download-artifact@v4
        with:
          name: platform-exe
          path: dist
      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.exe

      - name: Publish installers to MinIO (public download page)
        # Legacy optional mirror: never configured (empty secrets 410/failed
        # every run). Skipped inside the shell — a secrets-context `if` on a
        # step is not evaluated on tag pushes and made the whole workflow fail
        # to parse (0s "workflow file issue").
        env:
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "$MINIO_ENDPOINT" ]; then
            echo "MinIO mirror not configured — skipping"
            exit 0
          fi
          # mc (MinIO client) - single static binary.
          curl -fsSL -o /usr/local/bin/mc https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x /usr/local/bin/mc
          mc alias set minio "$MINIO_ENDPOINT" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
          # Upload this release's installers (overwrites same-name objects;
          # different versions accumulate so all releases stay downloadable).
          mc cp dist/*.dmg minio/"$MINIO_BUCKET"/
          mc cp dist/*.exe minio/"$MINIO_BUCKET"/
          # Regenerate a cumulative index.html listing every installer in the
          # bucket so the public "download page" shows all versions. Parse
          # `mc ls --json` (not the human format) so filenames with spaces
          # (e.g. "Platform Setup 1.0.0.exe") survive intact, and URL-encode the
          # hrefs. node is on the runner from setup-node; the script uses only
          # double-quoted strings + backtick template literals so it is safe
          # inside a bash single-quoted argument.
          mc ls --json minio/"$MINIO_BUCKET"/ > /tmp/listing.json
          node -e 'const fs=require("fs");const items=fs.readFileSync("/tmp/listing.json","utf8").split("\n").filter(Boolean).map(l=>JSON.parse(l)).filter(i=>i.type==="file"&&/\.(dmg|exe)$/.test(i.key)).sort((a,b)=>a.key>b.key?-1:a.key<b.key?1:0);const rows=items.map(i=>`<li><a href="${encodeURIComponent(i.key)}">${i.key}</a> <span class="sz">(${Math.floor(i.size/1048576)} MiB)</span></li>`).join("");const html=`<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Platform Releases</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem;color:#222}h1{border-bottom:1px solid #ddd;padding-bottom:.5rem}ul{list-style:none;padding:0}li{margin:.6rem 0}.sz{color:#888;font-size:.85rem}a{font-weight:600}</style></head><body><h1>Platform Releases</h1><ul>${rows}</ul></body></html>`;fs.writeFileSync("dist/index.html",html);console.log("index.html:",items.length,"installers")'
          mc cp dist/index.html minio/"$MINIO_BUCKET"/
          PAGE_URL="$MINIO_ENDPOINT/$MINIO_BUCKET/index.html"
          echo "::notice::Public download page: $PAGE_URL"
          echo "Public download page: $PAGE_URL"
          mc ls minio/"$MINIO_BUCKET"/

  # ── 装机 e2e（automate-nonweb-acceptance 4.1）─────────────────────────────
  # 把 2026-10-27 v1.3.19 首裁的三分支固化为每次发布自动断言：装 → 起管家
  # （bundled node 直启，避开 GUI/launchctl 在 runner 的确定性赤字）→ 开 app
  # 断 ATTACHED → 杀 UI 断管家栈仍 healthy → 杀管家+死 pid 断 stale 自清回退
  # embedded → 卸载断清场。资产走 build 的 workflow artifact（tag 与 dispatch
  # 同一路径，不依赖 GitHub Release 已生成）。
  installer-e2e:
    name: installer e2e (windows)
    needs: build
    # always(): build 可能在「复用产物」dispatch 里被跳过——此时仍需执行。
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ github.event.inputs.artifact_run_id == '' }}
        with:
          name: platform-exe
          path: installer

      - name: Fetch exe from a previous run (reuse mode)
        if: ${{ github.event.inputs.artifact_run_id != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          gh run download ${{ github.event.inputs.artifact_run_id }} -n platform-exe -D installer -R ${{ github.repository }}

      - name: Install silently (NSIS /S, per-user)
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer -Filter *.exe | Select-Object -First 1
          Start-Process -FilePath $exe.FullName -ArgumentList '/S' -Wait
          $app = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Platform.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw "installed Platform.exe not found" }
          "APP_EXE=$($app.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Boot steward directly and wait for discovery
        shell: pwsh
        run: |
          $root = Split-Path (Split-Path $env:APP_EXE)
          $node = Join-Path $root 'resources\node\node.exe'
          $entry = Join-Path $root 'resources\app\supervisor\steward-main.js'
          if (-not (Test-Path $node)) { throw "bundled node missing: $node" }
          if (-not (Test-Path $entry)) { throw "steward entry missing: $entry" }
          $data = Join-Path $env:TEMP 'steward-e2e/data'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          "STEWARD_DATA=$data" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "STEWARD_NODE=$node" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:PLATFORM_DATA_DIR = $data
          Start-Process -FilePath $node -ArgumentList @($entry) -NoNewWindow
          $json = Join-Path $data 'steward.json'
          for ($i = 0; $i -lt 60 -and -not (Test-Path $json); $i++) { Start-Sleep -Seconds 2 }
          if (-not (Test-Path $json)) { throw "steward.json never appeared (control plane did not boot)" }
          $disc = Get-Content $json -Raw | ConvertFrom-Json
          "STEWARD_PID=$($disc.pid)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if (-not (Get-Process -Id $disc.pid -ErrorAction SilentlyContinue)) { throw "steward pid $($disc.pid) not alive" }

      - name: Steward stack must reach healthy (bundled-node children spawn)
        shell: pwsh
        run: |
          # The 2026-10-27 first-trial defect: bare `node` children died with
          # "command not found" on a bare PATH. Ask the control plane directly.
          $client = Join-Path (Split-Path (Split-Path $env:APP_EXE)) 'resources\app\supervisor\steward-client.js'
          $probe = @"
          import { readStewardDiscovery, createStewardClient } from "file:///$($client -replace '\\','/')";
          const d = readStewardDiscovery(process.env.STEWARD_DATA);
          const c = createStewardClient({ socket: d.socket, timeoutMs: 5000 });
          const st = await c.request("status");
          console.log(JSON.stringify(st.servers ?? []));
          const s = (st.servers ?? [])[0];
          if (!s || s.state !== "healthy") { console.error("not healthy: " + JSON.stringify(s)); process.exit(1); }
          "@
          $probe | Out-File -FilePath "$env:TEMP\steward-status.mjs" -Encoding utf8
          $ok = $false
          for ($i = 0; $i -lt 45 -and -not $ok; $i++) {
            & $env:STEWARD_NODE "$env:TEMP\steward-status.mjs"
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 2 }
          }
          if (-not $ok) { throw "steward stack never became healthy (nodeBin/PATH regression?)" }

      - name: App attaches; UI exit leaves the resident stack alive
        shell: pwsh
        run: |
          $log = Join-Path $env:APPDATA 'platform\main.log'
          $before = if (Test-Path $log) { (Get-Content $log).Count } else { 0 }
          Start-Process -FilePath $env:APP_EXE
          $attached = $false
          for ($i = 0; $i -lt 60 -and -not $attached; $i++) {
            Start-Sleep -Seconds 2
            $tail = if (Test-Path $log) { Get-Content $log | Select-Object -Skip $before } else { @() }
            if ($tail -match 'ATTACHED to steward') { $attached = $true }
          }
          if (-not $attached) { throw "app never attached to the resident steward" }
          Get-Process -Name 'Platform' -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 8
          if (-not (Get-Process -Id $env:STEWARD_PID -ErrorAction SilentlyContinue)) { throw "steward died with the UI — resident semantics broken" }
          & $env:STEWARD_NODE "$env:TEMP\steward-status.mjs"
          if ($LASTEXITCODE -ne 0) { throw "resident stack not healthy after UI exit" }

      - name: Stale discovery falls back to embedded (never a second stack)
        shell: pwsh
        run: |
          Stop-Process -Id $env:STEWARD_PID -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 4
          $json = Join-Path $env:STEWARD_DATA 'steward.json'
          @{ socket = "$env:STEWARD_DATA\gone.sock"; protocolVersion = 1; pid = 999999; startedAt = 0; dataDir = $env:STEWARD_DATA } |
            ConvertTo-Json | Set-Content $json
          $log = Join-Path $env:APPDATA 'platform\main.log'
          $before = if (Test-Path $log) { (Get-Content $log).Count } else { 0 }
          Start-Process -FilePath $env:APP_EXE
          $fellBack = $false
          for ($i = 0; $i -lt 45 -and -not $fellBack; $i++) {
            Start-Sleep -Seconds 2
            $tail = if (Test-Path $log) { Get-Content $log | Select-Object -Skip $before } else { @() }
            if ($tail -match 'stale steward discovery removed|constructed embedded') { $fellBack = $true }
          }
          Get-Process -Name 'Platform' -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $fellBack) { throw "stale steward.json did not fall back to embedded" }
          if (Test-Path $json) { throw "stale steward.json was not cleaned up" }

      - name: Uninstall leaves the machine clean
        shell: pwsh
        run: |
          $un = Get-ChildItem (Split-Path $env:APP_EXE) -Filter 'Uninstall*.exe' | Select-Object -First 1
          Start-Process -FilePath $un.FullName -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 10
          if (Test-Path $env:APP_EXE) { throw "app files survived the uninstaller" }
          "uninstall clean" | Write-Host

  # ── 装机 e2e · macOS 腿（4.2，显式开启；launchctl 用 installPlan 断言替身）──
  installer-e2e-mac:
    name: installer e2e (macOS, opt-in)
    needs: build
    if: ${{ always() && inputs.installer_e2e_mac == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ github.event.inputs.artifact_run_id == '' }}
        with:
          name: platform-dmg-arm64
          path: installer

      - name: Fetch dmg from a previous run (reuse mode)
        if: ${{ github.event.inputs.artifact_run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p installer
          gh run download ${{ github.event.inputs.artifact_run_id }} -n platform-dmg-arm64 -D installer -R ${{ github.repository }}

      - name: Mount dmg and extract the app (no /Applications write, no launchctl)
        run: |
          set -euo pipefail
          DMG=$(ls installer/*.dmg | head -1)
          mnt=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -quiet -mountpoint "$mnt"
          mkdir -p "$RUNNER_TEMP/apps"
          cp -R "$mnt/Platform.app" "$RUNNER_TEMP/apps/"
          hdiutil detach "$mnt" -quiet
          APP="$RUNNER_TEMP/apps/Platform.app"
          test -x "$APP/Contents/Resources/node/bin/node"
          test -f "$APP/Contents/Resources/app/supervisor/steward-main.js"
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "BUNDLE_NODE=$APP/Contents/Resources/node/bin/node" >> "$GITHUB_ENV"

      - name: LaunchAgent plan assertions (registration correctness without a GUI session)
        run: |
          set -euo pipefail
          # The import path must be a literal — inline $APP into the script.
          cat > "$RUNNER_TEMP/plan.mjs" <<JS
          import { installPlan } from "${APP}/Contents/Resources/app/electron/steward-install.js";
          const plan = installPlan({
            isPackaged: true,
            nodeBin: "${BUNDLE_NODE}",
            dataDir: process.env.RUNNER_TEMP + "/steward-data",
            resourcesDir: "${APP}/Contents/Resources",
          });
          if (plan.platform !== "darwin") throw new Error("plan platform: " + plan.platform);
          if (!plan.plistContent.includes("RunAtLoad") || !plan.plistContent.includes("KeepAlive")) throw new Error("plist missing login/KeepAlive semantics");
          if (!plan.plistContent.includes("${BUNDLE_NODE}")) throw new Error("plist does not point at the bundled node");
          if (!plan.plistContent.includes("/supervisor/steward-main.js")) throw new Error("plist does not point at the packaged steward entry");
          if (!plan.plistPath.includes("LaunchAgents")) throw new Error("plist not per-user LaunchAgents");
          console.log("plan ok: " + plan.plistPath);
          JS
          "$BUNDLE_NODE" "$RUNNER_TEMP/plan.mjs"

      - name: Steward boots healthy; app attaches; UI exit leaves it alive
        run: |
          set -euo pipefail
          export DATA="$RUNNER_TEMP/steward-data"
          mkdir -p "$DATA"
          PLATFORM_DATA_DIR="$DATA" "$BUNDLE_NODE" "$APP/Contents/Resources/app/supervisor/steward-main.js" > "$RUNNER_TEMP/steward.log" 2>&1 &
          for i in $(seq 1 60); do [ -f "$DATA/steward.json" ] && break; sleep 2; done
          test -f "$DATA/steward.json"
          cat > "$RUNNER_TEMP/status.mjs" <<JS
          import { readStewardDiscovery, createStewardClient } from "${APP}/Contents/Resources/app/supervisor/steward-client.js";
          const d = readStewardDiscovery(process.env.DATA);
          const c = createStewardClient({ socket: d.socket, timeoutMs: 5000 });
          const st = await c.request("status");
          const s = (st.servers ?? [])[0];
          if (!s || s.state !== "healthy") { console.error(JSON.stringify(s)); process.exit(1); }
          console.log("healthy on " + s.port);
          JS
          ok=0
          for i in $(seq 1 45); do "$BUNDLE_NODE" "$RUNNER_TEMP/status.mjs" && ok=1 && break; sleep 2; done
          test "$ok" = "1"
          LOG="$HOME/Library/Application Support/platform/main.log"
          before=$(wc -l < "$LOG" 2>/dev/null || echo 0)
          open -na "$APP"
          attached=0
          for i in $(seq 1 60); do
            sleep 2
            tail -n "+$((before+1))" "$LOG" 2>/dev/null | grep -q "ATTACHED to steward" && attached=1 && break
          done
          test "$attached" = "1"
          osascript -e 'quit app "Platform"' || true
          sleep 8
          pgrep -f "steward-main.js" > /dev/null
          "$BUNDLE_NODE" "$RUNNER_TEMP/status.mjs"

      - name: Stale discovery falls back to embedded; drag-deleted bundle self-cleans
        run: |
          set -euo pipefail
          pkill -f "steward-main.js" || true
          sleep 3
          node -e 'const fs=require("fs");const p=process.env.DATA+"/steward.json";fs.writeFileSync(p,JSON.stringify({socket:process.env.DATA+"/gone.sock",protocolVersion:1,pid:999999,startedAt:0,dataDir:process.env.DATA}))'
          LOG="$HOME/Library/Application Support/platform/main.log"
          before=$(wc -l < "$LOG" 2>/dev/null || echo 0)
          open -na "$APP"
          fell=0
          for i in $(seq 1 45); do
            sleep 2
            tail -n "+$((before+1))" "$LOG" 2>/dev/null | grep -qE "stale steward discovery removed|constructed embedded" && fell=1 && break
          done
          osascript -e 'quit app "Platform"' || true
          test "$fell" = "1"
          test ! -f "$DATA/steward.json"

      - name: Drag-deleted bundle guard is present (static; behaviour needs a real login session)
        run: |
          # Triggering the guard needs the entry to run from inside a live .app and
          # then the bundle to vanish — not reproducible on an ephemeral runner.
          # We pin the guard's presence instead; true login-respawn coverage stays
          # in the monthly human spot-check (design D7 / Non-Goals).
          grep -q "self-deregistering" "$APP/Contents/Resources/app/supervisor/steward-main.js"
