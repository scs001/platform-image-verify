# ── CI/CD: build on GitHub Actions → Tencent TCR personal registry ───────────
#
# The PRIMARY image pipeline (DEPLOY.md → "Image pipeline (GitHub Actions →
# TCR)"). Builds the single-process image on a GitHub runner, smoke-tests it,
# and pushes it to the Tencent personal registry the cluster pulls from:
#
#   build  (GH runner): docker build (web/dist built inside the Dockerfile;
#                       .dockerignore excludes any host copy) → boot the image
#                       and probe /api/config → push ccr.ccs.tencentyun.com/
#                       yizuo/platform:sha-<7> + :latest
#   deploy (hand):     copy the tag from the run summary into
#                       fd-infra-deploy/all-services/prod/platform.yaml — the
#                       deliberate hand commit, same review gate the Jenkins
#                       path uses — then ArgoCD `all-services-prod` rolls it.
#
# Why TCR and not the internal Harbor (network reality, verified 2026-09-30):
#   - GitHub runners cannot reach the internal Harbor (100.64.0.8:30880 is a
#     private tailnet address) — the retired docker-deploy.yml died at
#     login for exactly this reason.
#   - ccr.ccs.tencentyun.com is a public HTTPS registry on the domestic
#     internet: runners push to it and the cheap nodes pull from it with no
#     insecure-registry hacks (the old workflow's daemon.json surgery is gone).
#   - The Jenkins → internal-Harbor path stays alive as the FALLBACK pipeline;
#     both use the same sha-<7> tag rule, so a GitOps commit can point at
#     either registry's image interchangeably.
#
# Required GitHub Secrets (create once, Settings → Secrets → Actions):
#   TCR_USER   Tencent Cloud account id for the personal registry login
#              (docker login ccr.ccs.tencentyun.com --username=<TCR_USER>)
#   TCR_PASS   the personal-registry password set in the TCR console
#              (访问管理 → 容器镜像服务个人版 → 获取/重置密码)
#
# First push note: if the push fails with "repository not found", create the
# private repo `platform` under the `yizuo` namespace in the TCR console
# (个人版 does not auto-create repos on push from CI).

name: image-tcr

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: image-tcr
  cancel-in-progress: true

env:
  REGISTRY: ccr.ccs.tencentyun.com
  # Personal-edition path: <registry>/<namespace>/<repo>. `yizuo` is the
  # console-created namespace; the private repo `platform` lives under it.
  IMAGE: ccr.ccs.tencentyun.com/yizuo/platform

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    # Cold full builds (native addons + pinned dsh tree + web build) have
    # exceeded 90m on runners before, and cache-to only saves on SUCCESS —
    # until one build completes, every run is cold. 240m lets the first
    # success break that deadlock; later runs are cache-warm and far shorter.
    timeout-minutes: 240
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # Same rule as the Jenkinsfile: the tag is the committing sha, so both
      # pipelines produce interchangeable tags for the same revision.
      - id: tag
        run: echo "tag=sha-$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # BASE_IMAGE stays at the Dockerfile default (docker.io node:25-bookworm
      # -slim): the runner can pull docker.io directly — the Jenkins override
      # exists only because the cheap-3 node cannot.
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USER }}
          password: ${{ secrets.TCR_PASS }}

      - uses: docker/setup-buildx-action@v3

      # Build WITHOUT pushing: the smoke gate below decides whether this image
      # is allowed to exist in the registry (the Jenkins pipeline's rule — a
      # build that compiles is not an image that runs).
      - name: Build image (load, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }},${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot the image before pushing it. Two historical pipeline revisions
      # produced images that bound the port and died moments later (a pruned
      # node_modules dep; a missing runtime dir) — neither shows up at build
      # time. The image ships curl; the probe runs in the container's own
      # netns, so no ports are published. server.js binds the port BEFORE it
      # finishes async agent init, so the death check matters as much as the
      # probe.
      - name: Smoke test (/api/config)
        run: |
          set -e
          TAG="${{ steps.tag.outputs.tag }}"
          docker rm -f platform-smoke >/dev/null 2>&1 || true
          docker run -d --name platform-smoke \
            -e AUTH_MODE=none -e PORT=3000 -e HOST=0.0.0.0 \
            -e PLATFORM_DATA_DIR=/data -e NODE_ENV=production \
            "${{ env.IMAGE }}:$TAG" >/dev/null
          ok=0
          for i in $(seq 1 40); do
            sleep 5
            if docker exec platform-smoke curl -fsS -m 5 http://127.0.0.1:3000/api/config >/dev/null 2>&1; then
              ok=1; echo "smoke: /api/config healthy after ~$((i*5))s"; break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' platform-smoke 2>/dev/null)" != "true" ]; then
              echo "smoke: container exited after ~$((i*5))s"; break
            fi
          done
          if [ "$ok" != "1" ]; then
            echo "SMOKE TEST FAILED — image does not serve /api/config; logs follow"
            docker logs platform-smoke 2>&1 | tail -40
            exit 1
          fi

      - name: Push image
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          docker push "${{ env.IMAGE }}:$TAG"
          docker push "${{ env.IMAGE }}:latest"

      - name: Summarize
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          {
            echo "## image-tcr"
            echo "Pushed \`${{ env.IMAGE }}:${TAG}\` (+ :latest)"
            echo ""
            echo "Deploy: set this tag in \`fd-infra-deploy/all-services/prod/platform.yaml\` and let ArgoCD \`all-services-prod\` roll it (see DEPLOY.md → Image pipeline)."
          } >> "$GITHUB_STEP_SUMMARY"
